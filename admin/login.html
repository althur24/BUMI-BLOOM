<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Bumi & Bloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/admin.css">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin-auth.js"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">BUMI / BLOOM</div>
    <div class="login-subtitle">Admin Dashboard</div>
    
    <div id="login-error" class="login-error"></div>
    
    <form id="login-form">
      <div class="admin-form-group" style="text-align: left;">
        <label for="email" class="admin-label">Email Address</label>
        <input type="email" id="email" class="admin-input" required placeholder="admin@bumibloom.example">
      </div>
      
      <div class="admin-form-group" style="text-align: left;">
        <label for="password" class="admin-label">Password</label>
        <input type="password" id="password" class="admin-input" required placeholder="••••••••">
      </div>
      
      <button type="submit" class="btn-admin btn-admin--primary" style="width: 100%; margin-top: var(--space-4);">
        Sign In
      </button>
    </form>
    
    <div style="margin-top: var(--space-6); font-size: var(--text-sm); color: var(--text-muted);">
      <a href="../index.html" style="color: inherit; text-decoration: underline;">Return to Storefront</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = e.target.querySelector('button');
      
      btn.textContent = 'Signing in...';
      btn.disabled = true;
      
      await window.bbAdminAuth.handleLogin(email, password, 'login-error');
      
      btn.textContent = 'Sign In';
      btn.disabled = false;
    });
  </script>
</body>
</html>
