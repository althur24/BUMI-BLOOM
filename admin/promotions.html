<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotions - Bumi & Bloom Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin-auth.js"></script>
</head>
<body class="admin-body">

  <!-- Sidebar (injected by admin-app.js) -->
  <aside class="admin-sidebar" id="admin-sidebar" data-admin-shell></aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-page-title">Promotions</h1>
      <button class="btn-admin btn-admin--primary" id="btn-add-promotion">Add Promotion</button>
    </header>

    <div class="admin-content">
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Label</th>
              <th>Type</th>
              <th>Value</th>
              <th>Active</th>
              <th>Usage</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="promotions-table-body">
            <tr><td colspan="7" style="text-align: center;">Loading promotions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="admin-modal-overlay" id="promotion-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 class="admin-page-title" id="promotion-modal-title">Add Promotion</h2>
        <button class="btn-admin btn-admin--outline" data-close-modal style="padding: var(--space-2); border: none;" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="admin-modal-body">
        <form id="promotion-form">
          <input type="hidden" id="promotion-id">

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="admin-form-group">
              <label class="admin-label">Code *</label>
              <input type="text" id="promotion-code" class="admin-input" required placeholder="e.g. WELCOME10" style="text-transform: uppercase;">
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Label *</label>
              <input type="text" id="promotion-label" class="admin-input" required placeholder="e.g. Welcome 10% off">
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Type *</label>
              <select id="promotion-type" class="admin-select" required>
                <option value="PERCENTAGE">Percentage</option>
                <option value="FIXED_AMOUNT">Fixed Amount</option>
              </select>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Value *</label>
              <div style="display: flex; align-items: center; gap: var(--space-2);">
                <input type="number" id="promotion-value" class="admin-input" step="0.01" min="0" required>
                <span id="promotion-value-suffix" style="font-weight: var(--fw-bold); white-space: nowrap;">%</span>
              </div>
              <small style="color: var(--text-muted);">Percentage: enter 10 for 10%. Fixed: enter AUD dollars.</small>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Starts At</label>
              <input type="datetime-local" id="promotion-starts-at" class="admin-input">
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Ends At</label>
              <input type="datetime-local" id="promotion-ends-at" class="admin-input">
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Usage Limit (optional)</label>
              <input type="number" id="promotion-usage-limit" class="admin-input" min="0" placeholder="Unlimited if empty">
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Active</label>
              <label class="admin-label" style="font-weight: var(--fw-regular); display: flex; align-items: center; gap: var(--space-2);">
                <input type="checkbox" id="promotion-is-active" checked>
                Promotion is active
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="admin-modal-footer" style="justify-content: space-between;">
        <button class="btn-admin btn-admin--danger" id="btn-delete-promotion" style="display: none;">Delete</button>
        <div style="display: flex; gap: var(--space-3);">
          <button class="btn-admin btn-admin--outline" data-close-modal>Cancel</button>
          <button class="btn-admin btn-admin--primary" id="btn-save-promotion" form="promotion-form">Save Promotion</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/admin-app.js"></script>
  <script src="../js/admin-promotions.js"></script>
</body>
</html>
