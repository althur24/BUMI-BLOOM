<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Bumi & Bloom Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin-auth.js"></script>
</head>
<body class="admin-body">

  <!-- Sidebar (injected by admin-app.js) -->
  <aside class="admin-sidebar" id="admin-sidebar" data-admin-shell></aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-page-title">Categories</h1>
      <button class="btn-admin btn-admin--primary" id="btn-add-category">Add Category</button>
    </header>

    <div class="admin-content">
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Visible in Menu</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-table-body">
            <tr><td colspan="4" style="text-align: center;">Loading categories...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="admin-modal-overlay" id="category-modal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 class="admin-page-title" id="category-modal-title">Add Category</h2>
        <button class="btn-admin btn-admin--outline" data-close-modal style="padding: var(--space-2); border: none;" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="admin-modal-body">
        <form id="category-form">
          <input type="hidden" id="category-id">

          <div class="admin-form-group">
            <label class="admin-label">Name *</label>
            <input type="text" id="category-name" class="admin-input" required>
          </div>

          <div class="admin-form-group">
            <label class="admin-label">Slug</label>
            <input type="text" id="category-slug" class="admin-input" placeholder="Auto-generated if empty">
          </div>

          <div class="admin-form-group">
            <label class="admin-label">Status</label>
            <select id="category-status" class="admin-select">
              <option value="PUBLISHED">Published</option>
              <option value="DRAFT">Draft</option>
              <option value="ARCHIVED">Archived</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label class="admin-label">
              <input type="checkbox" id="category-menu-visible" checked>
              Visible in Menu
            </label>
          </div>

        </form>
      </div>
      <div class="admin-modal-footer" style="justify-content: space-between;">
        <button class="btn-admin btn-admin--danger" id="btn-delete-category" style="display: none;">Delete</button>
        <div style="display: flex; gap: var(--space-3);">
          <button class="btn-admin btn-admin--outline" data-close-modal>Cancel</button>
          <button class="btn-admin btn-admin--primary" id="btn-save-category" form="category-form">Save Category</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/admin-app.js"></script>
  <script src="../js/admin-categories.js"></script>
</body>
</html>
