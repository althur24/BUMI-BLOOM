<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BUMI / BLOOM admin — manage products, stock, brands and promotions.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F2EEE9">
  <title>Admin — BUMI / BLOOM</title>
  <link rel="icon" type="image/webp" href="images/characters/whale.webp">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Quicksand:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-topbar">
    <a href="./" class="admin-topbar__logo">BUMI / BLOOM<span class="admin-topbar__logo-dot"></span></a>
    <span class="admin-topbar__tag">Admin</span>
  </header>

  <!-- Login view -->
  <main id="admin-login" class="admin-login">
    <span class="floating-shape floating-shape--coral floating-shape--blob floating-shape--lg" style="top:8%;left:6%;"></span>
    <span class="floating-shape floating-shape--blue floating-shape--blob floating-shape--md" style="bottom:12%;right:8%;animation-delay:1.5s;"></span>
    <span class="floating-shape floating-shape--yellow floating-shape--blob floating-shape--sm" style="top:20%;right:14%;animation-delay:0.8s;"></span>
    <div class="auth-card">
      <img src="images/characters/whale.webp" alt="" class="auth-card__logo">
      <h1 class="auth-card__title">Admin Sign In</h1>
      <p class="auth-card__subtitle">Restricted to <span class="font-accent" style="font-size:1.2em;color:var(--color-script-accent);">BUMI / BLOOM</span> staff accounts.</p>
      <form id="login-form">
        <div class="field">
          <label class="field__label" for="login-email">Email <span class="req">*</span></label>
          <input class="input" id="login-email" name="email" type="email" placeholder="you@bumiandbloom.com" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="field__label" for="login-password">Password <span class="req">*</span></label>
          <input class="input" id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--full" type="submit" id="login-submit">Sign In</button>
      </form>
      <p class="auth-card__toggle"><a href="./">← Back to the shop</a></p>
    </div>
  </main>

  <!-- Admin shell -->
  <div id="admin-shell" class="admin-shell">
    <aside class="admin-shell__sidebar">
      <div class="admin-shell__brand">
        <img src="images/characters/whale.webp" alt="" class="admin-shell__brand-logo">
        <span class="admin-shell__brand-dot"></span>
      </div>
      <nav class="admin-nav" aria-label="Admin sections">
        <button type="button" class="admin-nav__item is-active" data-tab="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </button>
        <button type="button" class="admin-nav__item" data-tab="products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 7.27L12 12l-8.5-4.73"/><path d="M12 22V12"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Products
        </button>
        <button type="button" class="admin-nav__item" data-tab="brands">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Brands
        </button>
        <button type="button" class="admin-nav__item" data-tab="categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Categories
        </button>
        <button type="button" class="admin-nav__item" data-tab="collections">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Collections
        </button>
        <button type="button" class="admin-nav__item" data-tab="promotions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Promotions
        </button>
      </nav>
      <div class="admin-shell__user">
        <div class="admin-shell__user-info">
          <strong id="admin-user-name">—</strong>
          <small id="admin-user-role">—</small>
        </div>
        <button type="button" class="btn btn--ghost btn--sm" id="sign-out-btn">Sign Out</button>
      </div>
    </aside>

    <main class="admin-shell__content">
      <section id="tab-dashboard" class="admin-tab is-active" data-tab-panel="dashboard"></section>
      <section id="tab-products" class="admin-tab" data-tab-panel="products"></section>
      <section id="tab-brands" class="admin-tab" data-tab-panel="brands"></section>
      <section id="tab-categories" class="admin-tab" data-tab-panel="categories"></section>
      <section id="tab-collections" class="admin-tab" data-tab-panel="collections"></section>
      <section id="tab-promotions" class="admin-tab" data-tab-panel="promotions"></section>
    </main>
  </div>

  <!-- Reusable modal + toast (driven by js/admin.js) -->
  <div class="modal-overlay" id="modal-overlay"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
