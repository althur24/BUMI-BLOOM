<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Indonesian batik pattern with needle, thread and fabric swatches">
  <defs>
    <pattern id="batik" width="140" height="140" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#0A3C77" stroke-width="3" opacity="0.75">
        <circle cx="70" cy="70" r="34"/>
        <circle cx="70" cy="70" r="14"/>
        <path d="M70 20 q14 22 0 34 q-14 -12 0 -34 M120 70 q-22 14 -34 0 q12 -14 34 0 M70 120 q-14 -22 0 -34 q14 12 0 34 M20 70 q22 -14 34 0 q-12 14 -34 0"/>
        <circle cx="70" cy="20" r="4" fill="#E85234" stroke="none"/>
        <circle cx="120" cy="70" r="4" fill="#E85234" stroke="none"/>
        <circle cx="70" cy="120" r="4" fill="#E85234" stroke="none"/>
        <circle cx="20" cy="70" r="4" fill="#E85234" stroke="none"/>
      </g>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#F7F3EE"/>
  <circle cx="1280" cy="230" r="210" fill="#FDE6E1"/>
  <circle cx="1350" cy="700" r="260" fill="#E2EAF4"/>
  <path d="M0 850 Q400 800 800 842 T1600 826 L1600 1000 L0 1000 Z" fill="#F9B8AF" opacity="0.35"/>

  <!-- batik swatch -->
  <g transform="rotate(-3 460 500)">
    <rect x="170" y="180" width="560" height="620" rx="26" fill="#F2D7D3" stroke="#0A3C77" stroke-width="6"/>
    <rect x="200" y="210" width="500" height="560" rx="14" fill="#F9E9E7" stroke="#0A3C77" stroke-width="3"/>
    <rect x="200" y="210" width="500" height="560" rx="14" fill="url(#batik)"/>
    <path d="M200 400 q120 -34 250 0 t250 0" fill="none" stroke="#E85234" stroke-width="6" opacity="0.7"/>
    <path d="M200 580 q120 -34 250 0 t250 0" fill="none" stroke="#E85234" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- folded fabric -->
  <g transform="translate(800 560)">
    <path d="M0 0 H300 L340 70 L60 90 Z" fill="#96ADD6" stroke="#0A3C77" stroke-width="5" stroke-linejoin="round"/>
    <path d="M12 40 H312 L352 110 L72 130 Z" fill="#F9B8AF" stroke="#0A3C77" stroke-width="5" stroke-linejoin="round"/>
    <path d="M24 80 H324 L364 150 L84 170 Z" fill="#F7F3EE" stroke="#0A3C77" stroke-width="5" stroke-linejoin="round"/>
    <path d="M60 96 L100 92 M240 40 L286 36" stroke="#0A3C77" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- thread + needle -->
  <path d="M1080 300 q120 -90 230 10 q100 90 0 160 q-110 78 -40 170" fill="none" stroke="#E85234" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(1290 300) rotate(28)">
    <path d="M0 0 L210 60" stroke="#0A3C77" stroke-width="7" stroke-linecap="round"/>
    <path d="M-14 0 q10 -12 22 -4 l10 8 q-12 12 -24 4 Z" fill="#F7F3EE" stroke="#0A3C77" stroke-width="4"/>
    <path d="M206 58 l22 6" stroke="#0A3C77" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- spool -->
  <g transform="translate(1050 640)">
    <rect x="0" y="0" width="120" height="150" rx="16" fill="#F6CB6A" stroke="#0A3C77" stroke-width="6"/>
    <rect x="-14" y="-14" width="148" height="20" rx="10" fill="#F9B8AF" stroke="#0A3C77" stroke-width="5"/>
    <rect x="-14" y="144" width="148" height="20" rx="10" fill="#F9B8AF" stroke="#0A3C77" stroke-width="5"/>
    <path d="M14 42 H106 M14 76 H106 M14 110 H106" stroke="#E89A8F" stroke-width="5"/>
  </g>

  <!-- bloom doodles -->
  <g fill="none" stroke="#0A3C77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1180 850 q0 -60 46 -86 q46 26 46 86" stroke="#96ADD6" stroke-width="6"/>
    <path d="M1196 820 q-26 -8 -34 -32 M1256 820 q26 -8 34 -32" stroke="#96ADD6" stroke-width="6"/>
    <path d="M1226 764 q-14 -26 0 -44 q14 18 0 44 z" fill="#F9B8AF"/>
  </g>
  <g fill="none" stroke="#E85234" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M880 190 l14 30 l33 4 l-24 22 l7 32 l-30 -17 l-30 17 l7 -32 l-24 -22 l33 -4 Z"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.03"/>
</svg>
