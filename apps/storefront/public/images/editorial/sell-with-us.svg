<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration of fabric bolts, a sewing pattern and a clothing rail for independent kids brands">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#0A3C77" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#F7F3EE"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="920" cy="220" r="170" fill="#FDE6E1"/>
  <circle cx="230" cy="640" r="220" fill="#E2EAF4"/>
  <path d="M0 780 Q300 726 600 766 T1200 752 L1200 900 L0 900 Z" fill="#F6CB6A" opacity="0.35"/>

  <!-- rail -->
  <g stroke="#0A3C77" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M520 120 H1080"/>
    <path d="M560 120 V700"/>
    <path d="M1040 120 V700"/>
    <path d="M520 700 H600"/>
    <path d="M1000 700 H1080"/>
  </g>

  <!-- garments on rail -->
  <g transform="translate(640 150)">
    <path d="M70 52 L48 24 L78 12 L112 40 L146 12 L176 24 L154 52" fill="none" stroke="#0A3C77" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(30 48) scale(0.78)">
      <path d="M40 18 L68 6 Q90 34 112 6 L140 18 L168 52 L146 78 L132 66 L132 206 Q90 216 48 206 L48 66 L34 78 L12 52 Z"
            fill="#F9B8AF" stroke="#0A3C77" stroke-width="5" stroke-linejoin="round"/>
      <path d="M68 6 Q90 34 112 6" fill="none" stroke="#0A3C77" stroke-width="4" stroke-linecap="round"/>
      <path d="M56 80 Q90 94 124 80" fill="none" stroke="#F7F3EE" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(840 150)">
    <path d="M70 52 L48 24 L78 12 L112 40 L146 12 L176 24 L154 52" fill="none" stroke="#0A3C77" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(40 56) scale(0.72)">
      <path d="M28 18 H152 L164 70 L126 124 L108 92 H72 L54 124 L16 70 Z"
            fill="#96ADD6" stroke="#0A3C77" stroke-width="5" stroke-linejoin="round"/>
      <path d="M26 44 Q90 58 154 44" fill="none" stroke="#0A3C77" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- fabric bolts -->
  <g transform="translate(120 520)">
    <g transform="rotate(-6)">
      <rect x="0" y="0" width="260" height="100" rx="50" fill="#F9B8AF" stroke="#0A3C77" stroke-width="5"/>
      <ellipse cx="255" cy="50" rx="24" ry="50" fill="#FDE6E1" stroke="#0A3C77" stroke-width="5"/>
      <ellipse cx="255" cy="50" rx="9" ry="21" fill="#F7F3EE" stroke="#0A3C77" stroke-width="3"/>
    </g>
    <g transform="translate(30 120) rotate(3)">
      <rect x="0" y="0" width="240" height="94" rx="47" fill="#96ADD6" stroke="#0A3C77" stroke-width="5"/>
      <ellipse cx="236" cy="47" rx="22" ry="47" fill="#E2EAF4" stroke="#0A3C77" stroke-width="5"/>
      <ellipse cx="236" cy="47" rx="8" ry="20" fill="#F7F3EE" stroke="#0A3C77" stroke-width="3"/>
    </g>
    <g transform="translate(-10 230) rotate(-2)">
      <rect x="0" y="0" width="210" height="86" rx="43" fill="#F6CB6A" stroke="#0A3C77" stroke-width="5"/>
      <ellipse cx="205" cy="43" rx="20" ry="43" fill="#FDF1D6" stroke="#0A3C77" stroke-width="5"/>
      <ellipse cx="205" cy="43" rx="7" ry="18" fill="#F7F3EE" stroke="#0A3C77" stroke-width="3"/>
    </g>
  </g>

  <!-- pattern sheet -->
  <g transform="translate(430 470) rotate(4)">
    <rect x="0" y="0" width="180" height="230" rx="8" fill="#FFFFFF" stroke="#0A3C77" stroke-width="4"/>
    <g fill="none" stroke="#E85234" stroke-width="3" stroke-dasharray="9 7">
      <path d="M40 60 L86 40 L110 84 L72 108 Z"/>
      <path d="M100 130 L152 142 L142 190 L98 176 Z"/>
    </g>
    <path d="M30 206 H150" stroke="#6E8AC0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- heart + doodles -->
  <path d="M1100 780 c0 0 -30 -20 -30 -42 c0 -10 7 -17 16 -17 c7 0 13 4 14 10 c1 -6 7 -10 14 -10 c9 0 16 7 16 17 c0 22 -30 42 -30 42 z" fill="#E85234"/>
  <g fill="none" stroke="#6E8AC0" stroke-width="5" stroke-linecap="round">
    <path d="M380 180 q34 -22 68 0 t68 0"/>
    <path d="M120 300 l10 21 l23 3 l-17 15 l5 22 l-21 -12 l-21 12 l5 -22 l-17 -15 l23 -3 Z" stroke="#E85234" stroke-width="4"/>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.03"/>
</svg>
