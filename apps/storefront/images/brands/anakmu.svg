<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Anakmu illustration with a cosy fleece sweater and a stack of organic cotton tees">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="fleece" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 q4 -5 9 0 q5 5 9 0" fill="none" stroke="#6E8AC0" stroke-width="1.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#F7F3EE"/>
  <circle cx="360" cy="500" r="330" fill="#FDE6E1"/>
  <circle cx="1300" cy="300" r="200" fill="#E2EAF4"/>
  <path d="M0 850 Q400 800 800 840 T1600 826 L1600 1000 L0 1000 Z" fill="#F9B8AF" opacity="0.35"/>

  <!-- fleece sweater -->
  <g transform="translate(230 200) scale(1.8)">
    <path d="M60 44 L94 26 L110 58 L126 26 L160 44 L196 96 L168 124 L154 106 L154 252 Q110 266 66 252 L66 106 L52 124 L24 96 Z"
          fill="#96ADD6" stroke="#0A3C77" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60 44 L94 26 L110 58 L126 26 L160 44 L196 96 L168 124 L154 106 L154 252 Q110 266 66 252 L66 106 L52 124 L24 96 Z"
          fill="url(#fleece)"/>
    <path d="M94 26 Q110 56 126 26" fill="none" stroke="#0A3C77" stroke-width="5" stroke-linecap="round"/>
    <path d="M66 236 Q110 250 154 236" fill="none" stroke="#0A3C77" stroke-width="4" stroke-linecap="round"/>
    <path d="M72 244 V256 M90 248 V260 M110 250 V262 M130 248 V260 M148 244 V256" stroke="#0A3C77" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <path d="M46 112 L64 132 M174 112 L156 132" stroke="#E2EAF4" stroke-width="6" stroke-linecap="round"/>
    <path d="M104 130 l8 17 l18 2 l-13 13 l3 18 l-16 -9 l-16 9 l3 -18 l-13 -13 l18 -2 Z" fill="#F7F3EE" opacity="0.9"/>
  </g>

  <!-- folded tee stack -->
  <g transform="translate(940 470)">
    <g>
      <rect x="0" y="120" width="300" height="66" rx="16" fill="#F9B8AF" stroke="#0A3C77" stroke-width="5"/>
      <path d="M16 152 H284" stroke="#E89A8F" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(10 -10)">
      <rect x="0" y="120" width="280" height="66" rx="16" fill="#F7F3EE" stroke="#0A3C77" stroke-width="5"/>
      <path d="M16 152 H264" stroke="#D9C7AE" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(20 -140)">
      <rect x="0" y="120" width="260" height="66" rx="16" fill="#96ADD6" stroke="#0A3C77" stroke-width="5"/>
      <path d="M16 152 H244" stroke="#6E8AC0" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- rolled sleeves -->
    <g fill="#F7F3EE" stroke="#0A3C77" stroke-width="4">
      <ellipse cx="316" cy="152" rx="26" ry="22"/>
      <ellipse cx="286" cy="42" rx="24" ry="20" fill="#F9B8AF"/>
      <ellipse cx="266" cy="-58" rx="22" ry="18" fill="#96ADD6"/>
    </g>
    <g fill="none" stroke="#0A3C77" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M304 152 q12 -6 24 0"/>
      <path d="M274 42 q10 -6 22 0"/>
      <path d="M254 -58 q10 -6 20 0"/>
    </g>
  </g>

  <!-- organic leaf doodle -->
  <g transform="translate(1290 740)">
    <path d="M0 80 Q0 0 62 -14 Q86 42 40 76 Q20 90 0 80 Z" fill="#A8C3A0" stroke="#0A3C77" stroke-width="5" stroke-linejoin="round"/>
    <path d="M8 76 Q26 30 58 -2" fill="none" stroke="#0A3C77" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#6E8AC0" stroke-width="6" stroke-linecap="round">
    <path d="M700 180 q40 -28 80 0 t80 0"/>
  </g>
  <path d="M760 300 c0 0 -26 -17 -26 -36 c0 -9 6 -15 14 -15 c6 0 12 4 12 10 c0 -6 6 -10 12 -10 c8 0 14 6 14 15 c0 19 -26 36 -26 36 z" fill="#E85234" opacity="0.85"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.03"/>
</svg>
