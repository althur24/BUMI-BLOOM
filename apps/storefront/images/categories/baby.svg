<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-label="Baby onesie, booties and rattle illustration">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M18 6 l4 10 l11 1 l-8 7 l2 11 l-9 -5 l-9 5 l2 -11 l-8 -7 l11 -1 Z" fill="#FFFFFF" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1000" height="1250" fill="#E2EAF4"/>
  <path d="M200 1250 V600 Q200 300 500 300 Q800 300 800 600 V1250 Z" fill="#F7F3EE" opacity="0.85"/>
  <rect width="1000" height="1250" fill="url(#stars)"/>
  <circle cx="180" cy="200" r="80" fill="#F6CB6A" opacity="0.7"/>

  <!-- onesie -->
  <g transform="translate(270 250)">
    <path d="M100 20 L140 4 Q180 52 220 4 L260 20 L300 90 L258 126 L238 100 L238 360 Q180 392 122 360 L122 100 L102 126 L60 90 Z"
          fill="#F2D7D3" stroke="#0A3C77" stroke-width="8" stroke-linejoin="round"/>
    <path d="M140 4 Q180 52 220 4" fill="none" stroke="#0A3C77" stroke-width="6" stroke-linecap="round"/>
    <path d="M122 100 H238" stroke="#0A3C77" stroke-width="5" opacity="0.6"/>
    <path d="M180 130 V320" stroke="#0A3C77" stroke-width="5"/>
    <g fill="#F9B8AF" stroke="#0A3C77" stroke-width="4">
      <circle cx="180" cy="170" r="8"/>
      <circle cx="180" cy="216" r="8"/>
      <circle cx="180" cy="262" r="8"/>
    </g>
    <path d="M118 366 q30 18 62 0 q32 18 62 0" fill="none" stroke="#0A3C77" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 116 L116 150 M270 116 L232 150" stroke="#96ADD6" stroke-width="9" stroke-linecap="round"/>
    <path d="M160 200 l7 14 l16 2 l-12 11 l3 16 l-14 -8 l-14 8 l3 -16 l-12 -11 l16 -2 Z" fill="#F7F3EE" opacity="0.9"/>
  </g>

  <!-- booties -->
  <g transform="translate(300 800)">
    <path d="M0 60 Q0 0 62 0 Q112 0 120 48 Q124 78 92 84 L16 84 Q0 84 0 60 Z"
          fill="#F9B8AF" stroke="#0A3C77" stroke-width="7" stroke-linejoin="round"/>
    <path d="M0 56 H120" stroke="#0A3C77" stroke-width="5"/>
    <path d="M24 24 Q56 8 92 22" fill="none" stroke="#F7F3EE" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(170 12)">
      <path d="M0 60 Q0 0 62 0 Q112 0 120 48 Q124 78 92 84 L16 84 Q0 84 0 60 Z"
            fill="#F9B8AF" stroke="#0A3C77" stroke-width="7" stroke-linejoin="round"/>
      <path d="M0 56 H120" stroke="#0A3C77" stroke-width="5"/>
      <path d="M24 24 Q56 8 92 22" fill="none" stroke="#F7F3EE" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- rattle -->
  <g transform="translate(760 940) rotate(18)">
    <rect x="0" y="0" width="26" height="120" rx="13" fill="#96ADD6" stroke="#0A3C77" stroke-width="6"/>
    <circle cx="13" cy="0" r="42" fill="#F6CB6A" stroke="#0A3C77" stroke-width="6"/>
    <circle cx="13" cy="-14" r="8" fill="#F7F3EE" stroke="#0A3C77" stroke-width="3"/>
  </g>

  <!-- doodles -->
  <g fill="none" stroke="#E85234" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800 520 l14 30 l33 4 l-24 22 l7 32 l-30 -17 l-30 17 l7 -32 l-24 -22 l33 -4 Z"/>
  </g>
  <g fill="none" stroke="#6E8AC0" stroke-width="6" stroke-linecap="round">
    <path d="M160 600 l10 21 l23 3 l-17 15 l5 22 l-21 -12 l-21 12 l5 -22 l-17 -15 l23 -3 Z"/>
    <path d="M150 1120 q42 -30 84 0 t84 0"/>
  </g>

  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.03"/>
</svg>
