  <ellipse cx="790" cy="480" rx="145" ry="22" fill="#0A3C77" opacity="0.07"/>
  <ellipse cx="590" cy="672" rx="135" ry="20" fill="#0A3C77" opacity="0.07"/>
  <ellipse cx="1015" cy="742" rx="165" ry="24" fill="#0A3C77" opacity="0.07"/>

