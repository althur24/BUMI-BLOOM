  <circle cx="120" cy="120" r="18" fill="none" stroke="#96ADD6" stroke-width="6"/>
  <circle cx="120" cy="120" r="34" fill="none" stroke="#96ADD6" stroke-width="4" opacity="0.45"/>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.03"/>
