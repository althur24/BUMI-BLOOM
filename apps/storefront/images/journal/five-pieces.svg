<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Flat-lay of five kids clothing essentials">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#0A3C77" opacity="0.09"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#F7F3EE"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <circle cx="300" cy="330" r="255" fill="#E2EAF4"/>
  <circle cx="935" cy="235" r="150" fill="#FDE6E1"/>
