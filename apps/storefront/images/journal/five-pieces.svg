    <path d="M118 232 c0 0 -9 -6 -9 -12 c0 -3 2 -5 5 -5 c2 0 4 1 4 3 c0 -2 2 -3 4 -3 c3 0 5 2 5 5 c0 6 -9 12 -9 12 z" fill="#E85234"/>
    <circle cx="100" cy="86" r="6" fill="#F7F3EE" stroke="#0A3C77" stroke-width="3"/>
  </g>

